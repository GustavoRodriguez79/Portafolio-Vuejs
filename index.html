<!DOCTYPE html>
<html lang="es">
  <head>
    <!-- ==============================
         CONFIGURACIÓN GENERAL DEL DOCUMENTO
         ============================== -->
    <meta charset="UTF-8"> <!-- Codificación de caracteres -->
    <link rel="icon" href="/favicon.ico"> <!-- Icono que aparece en la pestaña del navegador -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <!-- Hace que la página sea responsive, adaptándose al tamaño del dispositivo -->

    <!-- SEO: descripción y palabras clave -->
    <meta name="description" content="Portafolio de Gustavo Ariel Rodriguez, Técnico en Programación especializado en desarrollo web">
    <meta name="author" content="Gustavo Ariel Rodriguez">
    <meta name="theme-color" content="#0c0f14"> <!-- Color de la barra del navegador en celulares (igual al fondo oscuro) -->

    <!-- Vista previa al compartir el link (LinkedIn, WhatsApp, X). Las URLs deben ser absolutas -->
    <meta property="og:type" content="website">
    <meta property="og:locale" content="es_AR">
    <meta property="og:title" content="Gustavo Ariel Rodriguez | Portafolio Web">
    <meta property="og:description" content="Técnico en Programación especializado en desarrollo web full stack. Proyectos, formación y CV.">
    <meta property="og:url" content="https://gustavo-rodriguez-portafolio-vuejs.netlify.app/">
    <meta property="og:image" content="https://gustavo-rodriguez-portafolio-vuejs.netlify.app/poster.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Gustavo Ariel Rodriguez | Portafolio Web">
    <meta name="twitter:description" content="Técnico en Programación especializado en desarrollo web full stack. Proyectos, formación y CV.">
    <meta name="twitter:image" content="https://gustavo-rodriguez-portafolio-vuejs.netlify.app/poster.jpg">

    <!-- Título de la pestaña -->
    <title>Gustavo Ariel Rodriguez | Portafolio Web</title>
  </head>
  <body>
    <!-- ==============================
         PUNTO DE MONTAJE DE VUE
         ============================== -->
    <div id="app"></div> <!-- Aquí Vue montará toda la aplicación -->

    <!-- ==============================
         SCRIPT PRINCIPAL DE VUE
         ============================== -->
    <script type="module" src="/src/main.js"></script>
    <!-- Importa el archivo main.js que inicializa la aplicación Vue -->
  </body>
</html>
